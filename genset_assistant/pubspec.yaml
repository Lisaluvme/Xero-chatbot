name: genset_assistant
description: A Flutter application to assist users in learning about, maintaining, and troubleshooting generators.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^6.2.1

  # Mirror API Integration
  retrofit: ^4.8.0
  dio: ^5.4.0
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.3.2
  timezone: ^0.10.1
  flutter_html: ^3.0.0
  shared_preferences: ^2.3.2

  # Enhanced AI Chatbot Features
  speech_to_text: 7.3.0
  flutter_tts: ^4.2.3

  # PDF and File Sharing
  pdf: ^3.10.7
  share_plus: ^12.0.1
  path_provider: ^2.1.2

  # Permissions and Utilities
  permission_handler: ^12.0.1
  intl: ^0.20.2

  # OpenAI Integration
  dart_openai: ^5.1.0

  # Image caching for better performance
  cached_network_image: ^3.3.0

  # Flutter launcher icons
  flutter_launcher_icons: ^0.14.4

  # ✅ Google Fonts for custom text styling
  google_fonts: ^6.3.2

  # State Management
  provider: ^6.1.1

  # Environment variables
  flutter_dotenv: ^6.0.0
  device_info_plus: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/knowledge_base.json
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/mg_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/mg_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/mg_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/mg_logo.png"
