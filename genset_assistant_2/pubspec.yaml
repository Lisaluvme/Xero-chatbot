name: genset_assistant_2
description: A Flutter application to assist users in learning about, maintaining, and troubleshooting generators.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  # Mirror API Integration
  retrofit: ^4.1.0
  dio: ^5.4.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.3.0
  timezone: ^0.9.2
  flutter_markdown: ^0.6.10
  flutter_html: ^3.0.0-beta.2
  shared_preferences: ^2.2.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.15.0
  # Enhanced AI Chatbot Features
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5
  pdf: ^3.10.7
  # printing: ^5.13.1
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  # OpenAI Integration
  dart_openai: ^5.1.0
  # Image caching for better performance
  cached_network_image: ^3.3.0
  # Flutter launcher icons
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/knowledge_base.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/mg_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/mg_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/mg_logo.png"
    icon_size: 48 # min:48, max:256, default:48
  macos:
    generate: true
    image_path: "assets/icons/mg_logo.png"
